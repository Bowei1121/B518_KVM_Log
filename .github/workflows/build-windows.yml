# Windows build for the Monitor UI (issue #107).
# PyInstaller cannot cross-compile, so the Windows exe is built here on windows-latest.
# CI and host-app/build_exe.bat both build from AtlasKVM.spec (UPX disabled).
name: Build Windows Executable

on:
  push:
    branches: [ main ]
    paths: [ 'host-app/**', 'tests/**', 'tools/**', '.github/workflows/build-windows.yml' ]
  pull_request:
    paths: [ 'host-app/**', 'tests/**', 'tools/**', '.github/workflows/build-windows.yml' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'  # Tk 8.6.12+ on Windows; matches the on-site Python
          cache: pip
          cache-dependency-path: host-app/requirements.txt

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r host-app/requirements.txt pytest

      - name: Show Tcl/Tk version
        shell: bash
        run: python -c "import sys, tkinter; print(sys.version); print('Tcl patchlevel', tkinter.Tcl().call('info', 'patchlevel'))"

      - name: Run Windows tests
        shell: bash
        # Scoped on purpose. The full suite has 17 Windows-only failures (daemon/pid, Monitor UI prefs,
        # UI client cancel), tracked in #111. Until that is closed, only the Windows-relevant modules run here;
        # the full suite stays a macOS/local run.
        # Default fd capture swaps std handles behind fds 0/1/2 each test while Tk roots stay alive;
        # --capture=sys leaves them unchanged. On windows-2025 the four-module step went from
        # Tk init failures in 5/19 runs to 0/14; the exact Tcl mechanism is unproven.
        # Guarded by tests/test_windows_ci_capture_140.py (static workflow check)
        # and the win32 capture check in tests/conftest.py.
        # tests/capture_default_140.py (pytest.ini addopts) also makes sys the Windows default for local runs.
        run: python -m pytest -o faulthandler_timeout=120 --capture=sys -q -rs tests/test_windows_dpi_107.py tests/test_monitor_hmi_106.py tests/test_monitor_hmi_115.py tests/test_monitor_hmi_117.py tests/test_monitor_hmi_126_scroll.py tests/test_windows_ci_capture_140.py tests/test_monitor_hmi_144.py tests/test_station_presentation.py tests/test_monitor_hmi_126.py tests/test_station_presentation_130.py tests/test_monitor_hmi_130.py tests/test_connect_failures_134.py tests/test_kvm_pool_connect_failures_134.py tests/test_core_status_134.py tests/test_station_presentation_134.py tests/test_monitor_hmi_134.py tests/test_core_exe_167.py tests/test_packaging_upx_202.py tests/test_core_localhost_only.py tests/test_device_round.py tests/test_core_indicator_168.py tests/test_monitor_hmi_168.py tools/fake_core/test_fake_core.py tests/test_green_occlusion_172.py tests/test_match_diagnostics.py tests/test_hid_during_check.py tests/test_colorspace_601.py tests/test_locator_diagnostics.py tests/test_dock_park_fresh_frame.py

  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: host-app/requirements.txt

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r host-app/requirements.txt
          python -m pip freeze > pip-freeze-windows.txt  # exact versions of this build, for on-site comparison

      - name: Write build info (version, git short hash, date; shown in the title and Log)
        shell: bash
        env:
          BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}  # the PR head, not the temporary merge commit
        run: python tools/write_build_info.py

      - name: Import smoke test (fails the job if any runtime dependency is missing)
        working-directory: host-app
        shell: bash
        run: |
          # Direct imports: a missing package must fail here, not inside the frozen exe at runtime.
          python -c "import cv2, av, aiortc, onnxruntime, rapidocr_onnxruntime, pattern_tools, stream_view, device_settings_window, ui_i18n, ui_app"
          # Same check the frozen exe runs below; exits non-zero on any missing runtime part.
          python ui_app.py --self-test
          # ui_app swallows import errors into None/False fallbacks (e.g. PatternCropper); turn those into hard failures.
          python -c "
          import ui_app as a
          missing = [n for n, ok in [('_TK_OK', a._TK_OK), ('_PIL_OK', a._PIL_OK), ('_CV2_OK', a._CV2_OK),
                                     ('PatternCropper', a.PatternCropper), ('StreamerWindow', a.StreamerWindow),
                                     ('DeviceSettingsWindow', a.DeviceSettingsWindow)] if not ok]
          assert not missing, (missing, a._PATTERN_IMPORT_ERROR)
          print('import smoke test: all modules OK')
          "

      - name: Build with PyInstaller (same flags as host-app/build_exe.bat)
        working-directory: host-app
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --clean AtlasKVM.spec

      - name: Verify exe exists
        shell: bash
        run: |
          test -f host-app/dist/AtlasKVM/AtlasKVM.exe
          test -f host-app/dist/AtlasKVM/Core.exe

      - name: Self-test the frozen exe (catches anything PyInstaller failed to bundle)
        shell: bash
        run: host-app/dist/AtlasKVM/AtlasKVM.exe --self-test

      - name: Exercise packaged Core and frozen bridge launch
        shell: bash
        run: python tools/ci_frozen_core_167.py

      - name: Include scheduler installation files
        shell: bash
        run: cp windows/* host-app/dist/AtlasKVM/

      - name: Install scheduled task, trigger it, ping Core, remove it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $PWD 'host-app/dist/AtlasKVM'
          $template = Join-Path $HOME 'Documents/template'
          New-Item -ItemType Directory -Force -Path $template | Out-Null
          if (!(Test-Path "$template/devices.json")) { Copy-Item config/devices.example.json "$template/devices.json" }
          function Ping-Core {
            try {
              $c = [Net.Sockets.TcpClient]::new('127.0.0.1', 5000)
              $w = [IO.StreamWriter]::new($c.GetStream()); $w.WriteLine('{"protocol_version":"1.0","req_id":"ci","device":"","cmd":"ping"}'); $w.Flush()
              $line = [IO.StreamReader]::new($c.GetStream()).ReadLine(); $c.Close()
              return $line -match '"pong"\s*:\s*true'
            } catch { return $false }
          }
          Get-Process Core -ErrorAction SilentlyContinue | Stop-Process -Force
          & "$dist/install-core.ps1"
          & "$dist/install-core.ps1"   # second run overwrites; still exactly one task
          if (@(Get-ScheduledTask -TaskName 'B518 Core').Count -ne 1) { throw 'expected exactly one task' }
          $t = Get-ScheduledTask -TaskName 'B518 Core'
          $s = $t.Settings; $cfg = Get-Content "$dist/core-scheduler.json" -Raw | ConvertFrom-Json
          if ($t.Principal.RunLevel -ne 'Limited') { throw 'RunLevel must be Limited' }
          if ($s.ExecutionTimeLimit -ne 'PT0S') { throw "ExecutionTimeLimit $($s.ExecutionTimeLimit)" }
          if ($s.MultipleInstances -ne 'IgnoreNew') { throw 'MultipleInstances' }
          if ($s.DisallowStartIfOnBatteries -or $s.StopIfGoingOnBatteries) { throw 'battery settings' }
          if ([Xml.XmlConvert]::ToTimeSpan($t.Triggers[1].Repetition.Interval).TotalMinutes -ne $cfg.interval_minutes) { throw 'repeat interval' }
          if ($t.Triggers[1].Repetition.Duration) { throw "repeat must have no end, got $($t.Triggers[1].Repetition.Duration)" }
          if ($t.Actions[0].WorkingDirectory -ne $dist) { throw "WorkingDirectory $($t.Actions[0].WorkingDirectory)" }
          Start-ScheduledTask -TaskName 'B518 Core'
          $ok = $false
          for ($i = 0; $i -lt 40 -and -not $ok; $i++) { Start-Sleep -Seconds 3; $ok = Ping-Core }
          if (-not $ok) { throw 'Core did not answer ping after the task was triggered' }
          Get-Process Core -ErrorAction SilentlyContinue | Stop-Process -Force
          & "$dist/remove-core.ps1"
          if (Get-ScheduledTask -TaskName 'B518 Core' -ErrorAction SilentlyContinue) { throw 'task still exists after remove' }

      - name: Upload Core diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-diagnostics-windows
          path: ~/Documents/logs
          if-no-files-found: warn

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AtlasKVM-windows
          path: host-app/dist/AtlasKVM
          if-no-files-found: error

      - name: Upload pip freeze
        uses: actions/upload-artifact@v4
        with:
          name: pip-freeze-windows
          path: pip-freeze-windows.txt
          if-no-files-found: error
